<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="王俊毅个人作品集 — 作品详情">
    <meta name="author" content="WANG JUNYI">
    <title>作品详情 · WANG JUNYI</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- 样式表 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="detail-page">

    <!-- ===== 导航栏 ===== -->
    <nav class="navbar" id="navbar">
        <div class="navbar-container">
            <a href="index.html" class="logo">WANG JUNYI</a>

            <button class="hamburger" id="hamburger" aria-label="菜单" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <ul class="nav-menu" id="nav-menu" role="list">
                <li><a href="index.html#home"    class="nav-link">首页</a></li>
                <li><a href="index.html#works"   class="nav-link">作品</a></li>
                <li><a href="index.html#about"   class="nav-link">关于</a></li>
                <li><a href="index.html#contact" class="nav-link">联系</a></li>
            </ul>
        </div>
    </nav>

    <!-- ===== 详情头部操作栏 ===== -->
    <div class="detail-header">
        <div class="detail-header-inner">
            <button class="back-btn" aria-label="返回作品列表">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
                返回作品列表
            </button>
        </div>
    </div>

    <!-- ===== 详情主体 ===== -->
    <div class="detail-container">

        <!-- 眉标 -->
        <div class="detail-eyebrow">
            <span class="section-label-line"></span>
            <span class="section-label-text" id="detail-category-label">作品详情</span>
        </div>

        <!-- 作品标题 -->
        <h1 class="detail-title" id="detail-title">加载中…</h1>

        <!-- 元信息 -->
        <div class="detail-meta" id="detail-meta">
            <div class="detail-meta-item">
                <span class="detail-meta-label">分类</span>
                <span class="detail-meta-value" id="meta-category">—</span>
            </div>
            <div class="detail-meta-item">
                <span class="detail-meta-label">类型</span>
                <span class="detail-meta-value" id="meta-type">—</span>
            </div>
            <div class="detail-meta-item">
                <span class="detail-meta-label">创作时间</span>
                <span class="detail-meta-value" id="meta-date">—</span>
            </div>
        </div>

        <!-- 详情内容（JS 填充） -->
        <div class="detail-content" id="detail-content"></div>

        <!-- 详情配图（JS 填充） -->
        <div class="detail-images" id="detail-images"></div>

    </div>

    <!-- ===== 页脚 ===== -->
    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-logo">WANG JUNYI</div>
            <div class="footer-meta">文化宣传 · 社区内容 · 语言服务</div>
            <div class="footer-line">© 2026 All rights reserved</div>
        </div>
    </footer>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <!-- 主逻辑 -->
    <script src="js/supabase.js"></script>
    <script src="js/script.js"></script>

    <!-- 导航滚动效果 -->
    <script>
        (function() {
            var navbar = document.getElementById('navbar');
            window.addEventListener('scroll', function() {
                if (window.scrollY > 40) navbar.classList.add('scrolled');
                else navbar.classList.remove('scrolled');
            }, { passive: true });

            // 汉堡菜单
            var hamburger = document.getElementById('hamburger');
            var navMenu = document.getElementById('nav-menu');
            if (hamburger && navMenu) {
                hamburger.addEventListener('click', function() {
                    hamburger.classList.toggle('active');
                    navMenu.classList.toggle('active');
                    hamburger.setAttribute('aria-expanded', navMenu.classList.contains('active'));
                });
            }
        })();
    </script>
</body>
</html>
